[project]
name = "loom-plan"
version = "0.1.0"
description = "Serveur MCP : vue unifiée Google Calendar + Google Tasks pour Claude Desktop"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.40",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.28",
    "mcp>=1.28,<2",
]

[project.scripts]
loom-plan = "loom_plan.cli:main"
loom-plan-mcp = "loom_plan.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.26",
    "pytest-mock>=3.14",
    "respx>=0.22",
    "pyright>=1.1",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
