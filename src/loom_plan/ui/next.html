<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>loom-plan — test MCP App</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.4 system-ui, sans-serif; }
  body { margin: 0; padding: 12px 16px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  h1 { font-size: 15px; margin: 0; }
  button { font: inherit; padding: 4px 10px; }
  pre { white-space: pre-wrap; margin: 0; }
  #status { opacity: .7; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>loom-plan · test MCP App</h1>
  <button id="refresh">Rafraîchir (appelle next)</button>
  <span id="status">initialisation…</span>
</header>
<pre id="out">(en attente du résultat du tool)</pre>
<script>
  // Minimal hand-written client for the MCP Apps postMessage dialect (spec 2026-01-26).
  const status = document.getElementById("status");
  const out = document.getElementById("out");
  const pending = new Map();
  let nextId = 1;

  function send(msg) { window.parent.postMessage(msg, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }

  function show(result) {
    const text = (result.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");
    out.textContent = text || JSON.stringify(result, null, 2);
    requestAnimationFrame(reportSize);
  }
  function reportSize() {
    notify("ui/notifications/size-changed", {
      width: document.documentElement.scrollWidth,
      height: document.documentElement.scrollHeight,
    });
  }

  window.addEventListener("message", (ev) => {
    const msg = ev.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id)) {
      const p = pending.get(msg.id); pending.delete(msg.id);
      msg.error ? p.reject(msg.error) : p.resolve(msg.result);
      return;
    }
    if (msg.method === "ui/notifications/tool-result") { status.textContent = "résultat reçu"; show(msg.params); }
    else if (msg.method === "ui/notifications/tool-input") { status.textContent = "appel en cours…"; }
  });

  document.getElementById("refresh").addEventListener("click", async () => {
    status.textContent = "rafraîchissement…";
    try { show(await request("tools/call", { name: "next", arguments: {} })); status.textContent = "à jour"; }
    catch (e) { status.textContent = "erreur : " + (e.message || JSON.stringify(e)); }
  });

  (async () => {
    try {
      const init = await request("ui/initialize", {
        protocolVersion: "2026-01-26",
        capabilities: {},
        clientInfo: { name: "loom-plan-next", version: "0.1.0" },
      });
      notify("ui/notifications/initialized", {});
      status.textContent = "connecté à " + (init.hostInfo && init.hostInfo.name || "l'hôte");
      reportSize();
    } catch (e) { status.textContent = "échec de l'initialisation : " + JSON.stringify(e); }
  })();
</script>
</body>
</html>
